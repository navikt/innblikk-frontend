<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Innblikk</title>
  </head>
  <body>
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('umami-theme')
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light'
          const darkBg = '#101b30'
          const lightBg = '#f4f6fb'
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(theme)
          document.body.style.backgroundColor = theme === 'dark' ? darkBg : lightBg
        } catch {
          // Ignore early-theme init errors.
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module">
      const { VITE_GCP_PROJECT_ID } = import.meta.env
      if (!window.__RUNTIME_CONFIG__) {
        window.__RUNTIME_CONFIG__ = {
          GCP_PROJECT_ID: VITE_GCP_PROJECT_ID,
        }
      }
      // Legacy globals for main UI code paths
      if (!window.__GCP_PROJECT_ID__ && VITE_GCP_PROJECT_ID) {
        window.__GCP_PROJECT_ID__ = VITE_GCP_PROJECT_ID
      }
    </script>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
