name: 'Deploy to dev'
run-name: 'Deploy ${{ github.ref_name }} to dev'

# Deploys the branch chosen in "Use workflow from" to the shared dev environment for testing.
# Coordinate with the team before replacing what is currently running there.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: 'CI'
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: read

  build:
    name: 'Build'
    needs: ci
    uses: navikt/reops-workflows/.github/workflows/build.yaml@v1
    permissions:
      contents: read
      packages: read
      id-token: write

  deploy:
    name: 'Deploy'
    needs: build
    uses: navikt/reops-workflows/.github/workflows/deploy.yaml@v1
    permissions:
      contents: read
      id-token: write
    with:
      cluster: dev-gcp
      manifest: .nais/dev/nais-dev.yaml
      ref: ${{ needs.build.outputs.source-sha }}
      image: ${{ needs.build.outputs.image }}
