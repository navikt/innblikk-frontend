name: 'Deploy Dev'
run-name: 'Deploy Dev @ ${{ github.ref_name }} — ${{ github.sha }}'

on:
  workflow_dispatch:

concurrency:
  group: 'deploy-dev'
  cancel-in-progress: false

jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-latest'
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: 'actions/checkout@v6'

      - name: 'Build and push'
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: team-researchops
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          build_secrets: |
            "NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}"

    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  deploy-dev:
    name: 'Deploy to Dev'
    needs: build
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: 'actions/checkout@v6'

      - name: 'Deploy to Dev'
        uses: 'nais/deploy/actions/deploy@v2'
        env:
          CLUSTER: 'dev-gcp'
          RESOURCE: .nais/dev/nais-dev.yaml
          VAR: image=${{ needs.build.outputs.image }},version=${{ github.sha }}

      - name: 'Create dev deployment tag'
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="dev-$(date -u +'%Y.%m.%d-%H%M%S')"
          git tag -a "$TAG_NAME" \
            -m "Development deployment of ${{ github.sha }}" \
            -m "Image: ${{ needs.build.outputs.image }}"
          git push origin "$TAG_NAME"
