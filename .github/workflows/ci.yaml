name: 'CI'
run-name: 'CI @ ${{ github.ref_name }} — ${{ github.sha }}'

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag or commit to check. Defaults to the triggering commit.'
        type: string
        default: ''

permissions:
  contents: read
  packages: read

# Cancel in-progress runs for the same branch/PR so stale runs don't waste minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 'Lint'
    runs-on: 'ubuntu-latest'
    env:
      HUSKY: 0
    steps:
      - uses: 'actions/checkout@v6'
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Run ESLint'
        run: pnpm lint

  build:
    name: 'Build'
    runs-on: 'ubuntu-latest'
    env:
      HUSKY: 0
    steps:
      - uses: 'actions/checkout@v6'
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Type-check and build'
        run: pnpm build

  test:
    name: 'Unit tests'
    runs-on: 'ubuntu-latest'
    env:
      HUSKY: 0
    steps:
      - uses: 'actions/checkout@v6'
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Run Vitest'
        run: pnpm test

  test-e2e:
    name: 'E2E tests'
    runs-on: 'ubuntu-latest'
    env:
      HUSKY: 0
    steps:
      - uses: 'actions/checkout@v6'
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Install Playwright browsers'
        run: pnpm exec playwright install --with-deps chromium

      - name: 'Run Playwright'
        run: pnpm test:e2e

      - name: 'Upload Playwright report'
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Builds the production image without pushing it, with the same shared workflow
  # used for deploys. Fork PRs are skipped: they get neither the Nais login token
  # nor access to the private @navikt packages the image needs.
  docker-build:
    name: 'Docker build'
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: navikt/reops-workflows/.github/workflows/build.yaml@v1
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      push: false
