name: 'CI'
run-name: 'CI @ ${{ github.ref_name }} — ${{ github.sha }}'

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Cancel in-progress runs for the same branch/PR so stale runs don't waste minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-title:
    name: 'Validate PR title'
    if: github.event_name == 'pull_request'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Check Conventional Commit format'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: 'PR title must not be empty after the type/scope prefix.'

  lint:
    name: 'Lint'
    runs-on: 'ubuntu-latest'
    env:
      HUSKY: 0
    steps:
      - uses: 'actions/checkout@v6'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Run ESLint'
        run: pnpm lint

  test:
    name: 'Unit tests'
    runs-on: 'ubuntu-latest'
    env:
      HUSKY: 0
    steps:
      - uses: 'actions/checkout@v6'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Run Vitest'
        run: pnpm test

  test-e2e:
    name: 'E2E tests'
    runs-on: 'ubuntu-latest'
    env:
      HUSKY: 0
    steps:
      - uses: 'actions/checkout@v6'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install Playwright browsers'
        run: pnpm exec playwright install --with-deps chromium

      - name: 'Run Playwright'
        run: pnpm test:e2e

      - name: 'Upload Playwright report'
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-dev:
    name: 'Deploy Dev'
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [lint, test, test-e2e]
    runs-on: 'ubuntu-latest'
    permissions:
      packages: write
      contents: write
      id-token: write
    steps:
      - uses: 'actions/checkout@v6'

      - name: 'Build and push'
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: team-researchops
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          build_secrets: |
            "NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}"

      - name: 'Deploy to Dev'
        uses: 'nais/deploy/actions/deploy@v2'
        env:
          CLUSTER: 'dev-gcp'
          RESOURCE: .nais/dev/nais-dev.yaml
          VAR: image=${{ steps.docker-build-push.outputs.image }},version=${{ github.sha }}

      - name: 'Create dev deployment tag'
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="dev-$(date -u +'%Y.%m.%d-%H%M%S')"
          git tag -a "$TAG_NAME" \
            -m "Development deployment of ${{ github.sha }}" \
            -m "Image: ${{ steps.docker-build-push.outputs.image }}"
          git push origin "$TAG_NAME"
