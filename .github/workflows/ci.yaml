name: 'CI'
run-name: 'CI @ ${{ github.ref_name }} — ${{ github.sha }}'

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:

permissions:
  contents: read
  packages: read

# Cancel in-progress runs for the same branch/PR so stale runs don't waste minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 'Lint'
    runs-on: 'ubuntu-latest'
    env:
      HUSKY: 0
    steps:
      - uses: 'actions/checkout@v7'

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Run ESLint'
        run: pnpm lint

  test:
    name: 'Unit tests'
    runs-on: 'ubuntu-latest'
    env:
      HUSKY: 0
    steps:
      - uses: 'actions/checkout@v7'

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Run Vitest'
        run: pnpm test

  test-e2e:
    name: 'E2E tests'
    runs-on: 'ubuntu-latest'
    env:
      HUSKY: 0
    steps:
      - uses: 'actions/checkout@v7'

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Install Playwright browsers'
        run: pnpm exec playwright install --with-deps chromium

      - name: 'Run Playwright'
        run: pnpm test:e2e

      - name: 'Upload Playwright report'
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
