apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: reops-innblikk-frontend
  namespace: team-researchops
  labels:
    team: team-researchops
spec:
  image: {{ image }}
  port: 8080
  envFrom:
  - secret: umami-bigquery
  liveness:
    path: /isalive
    port: 8080
    initialDelay: 20
    timeout: 60
  readiness:
    path: /isready
    port: 8080
    initialDelay: 20
    timeout: 60
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  ingresses:
    - https://innblikk.ansatt.dev.nav.no
  accessPolicy:
    outbound:
      external:
        - host: www.nav.no
        - host: reops-demo-appen.ekstern.dev.nav.no
        - host: teamkatalog-api.intern.nav.no
      rules:
          - application: reops-proxy
            namespace: team-researchops
          - application: reops-innblikk-backend
            namespace: team-researchops
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: nav.no
    sidecar:
      autoLogin: true
      enabled: true
  env:
    - name: SITEIMPROVE_BASE_URL
      value: "http://reops-proxy.team-researchops.svc.cluster.local/siteimprove"
    - name: GCP_PROJECT_ID
      value: "team-researchops-dev-4396"
    - name: BACKEND_BASE_URL
      value: "http://reops-innblikk-backend.team-researchops.svc.cluster.local"
    - name: BACKEND_WS_HOST
      value: "innblikk-backend.ansatt.dev.nav.no"
    - name: BACKEND_APP_NAME
      value: "reops-innblikk-backend"
    - name: NAIS_CLUSTER_NAME
      value: "dev-gcp"
