apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: umami-start
  namespace: team-researchops
  labels:
    team: team-researchops
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  image: {{ image }}
  port: 8080
  envFrom:
  - secret: umami-bigquery
  liveness:
    path: /isalive
    port: 8080
    initialDelay: 20
    timeout: 60
  readiness:
    path: /isready
    port: 8080
    initialDelay: 20
    timeout: 60
  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 80
  ingresses:
    - https://startumami.ansatt.nav.no
    - https://innblikk.ansatt.nav.no
  redirects:
    - from: https://startumami.ansatt.nav.no
      to: https://innblikk.ansatt.nav.no
  accessPolicy:
    outbound:
      external:
        - host: www.nav.no
      rules:
          - application: reops-proxy
            namespace: team-researchops
          - application: start-umami-backend
            namespace: team-researchops
  valkey:
    - instance: canvas-ws
      access: readwrite
  azure:
    application:
      enabled: true
      allowAllUsers: true
    sidecar:
      autoLogin: true
      enabled: true
  env:
    - name: SITEIMPROVE_BASE_URL
      value: "http://reops-proxy.team-researchops.svc.cluster.local/siteimprove"
    - name: GCP_PROJECT_ID
      value: "team-researchops-prod-01d6"
    - name: BACKEND_BASE_URL
      value: "http://start-umami-backend.team-researchops.svc.cluster.local"
    - name: BACKEND_APP_NAME
      value: "start-umami-backend"
    - name: NAIS_CLUSTER_NAME
      value: "prod-gcp"
